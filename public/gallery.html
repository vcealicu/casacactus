  <style>
    :root{
      --ink:#1a1a17;--cream:#f6f1e8;--cream-dark:#ede6d6;

      --es:cubic-bezier(.25,.46,.45,.94);

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--cream);color:var(--ink);font-family:var(--fb);font-weight:300;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1320px;margin:0 auto;padding:0 1.8rem}

    /* header */
    header{position:sticky;top:0;z-index:50;background:rgba(246,241,232,.86);backdrop-filter:blur(12px);border-bottom:1px solid rgba(26,26,23,.07)}
    .bar{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.8rem;max-width:1320px;margin:0 auto}
    .logo{font-family:var(--fd);font-size:1.5rem;letter-spacing:.02em}
    .back{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:.5rem;transition:color .3s var(--es)}
    .back:hover{color:var(--terracotta)}
    .back svg{width:15px;height:15px}

    /* intro */
    .intro{text-align:center;padding:4.5rem 1.8rem 2.6rem}
    .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1.1rem}
    .intro h1{font-family:var(--fd);font-weight:300;font-size:clamp(2.8rem,7vw,5rem);line-height:1.02;letter-spacing:-.01em}
    .intro p{max-width:540px;margin:1.4rem auto 0;color:var(--muted);font-size:1rem;line-height:1.7}

    /* masonry via columns */
    .grid{columns:4;column-gap:14px;padding:0 0 5rem}
    .g-item{break-inside:avoid;margin:0 0 14px;border-radius:3px;overflow:hidden;background:var(--cream-dark);cursor:zoom-in;position:relative;display:block}
    .g-item img{width:100%;height:auto;display:block;transition:transform .7s var(--es),opacity .6s var(--es);opacity:0}
    .g-item img.loaded{opacity:1}
    .g-item:hover img{transform:scale(1.04)}
    .g-item::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,16,12,.18),transparent 45%);opacity:0;transition:opacity .4s var(--es)}
    .g-item:hover::after{opacity:1}

    @media(max-width:1100px){.grid{columns:3}}
    @media(max-width:760px){.grid{columns:2;column-gap:10px}.g-item{margin-bottom:10px}.wrap{padding:0 1.1rem}.intro{padding:3.2rem 1.1rem 2rem}}
    @media(max-width:430px){.grid{columns:1}}

    /* lightbox */
    .lb{position:fixed;inset:0;z-index:100;background:rgba(12,12,10,.94);display:none;align-items:center;justify-content:center;padding:2rem;cursor:zoom-out}
    .lb.open{display:flex}
    .lb img{max-width:100%;max-height:90vh;border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .lb-close{position:absolute;top:1.4rem;right:1.6rem;color:var(--cream);background:none;border:none;cursor:pointer;padding:.4rem}
    .lb-close svg{width:30px;height:30px}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:var(--cream);background:none;border:none;cursor:pointer;padding:1rem;opacity:.7;transition:opacity .3s var(--es)}
    .lb-nav:hover{opacity:1}
    .lb-nav svg{width:34px;height:34px}
    .lb-prev{left:.6rem}.lb-next{right:.6rem}
    .lb-cap{position:absolute;bottom:1.4rem;left:0;right:0;text-align:center;color:rgba(246,241,232,.7);font-size:.72rem;letter-spacing:.12em;text-transform:capitalize}

    footer{text-align:center;padding:3rem 1.8rem 4rem;border-top:1px solid rgba(26,26,23,.07);color:var(--muted)}
    footer .fl{font-family:var(--fd);font-size:1.6rem;color:var(--ink);margin-bottom:.6rem}
    footer a{color:var(--terracotta)}
    footer .small{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;margin-top:.4rem}

    // ── @IMAGES_END ──────────────────────────────────────────────────────
    var BASE = "/images/";
    var grid = document.getElementById("grid");
    var live = []; // images that actually loaded, for lightbox order

    IMAGES.forEach(function(name){
      var a = document.createElement("a");
      a.className = "g-item";
      a.href = BASE + name + ".webp";
      var img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.src = BASE + name + ".webp";
      img.alt = name.replace(/-/g," ");
      img.addEventListener("load", function(){ img.classList.add("loaded"); });
      // if a file isn't on the server yet, quietly remove its tile
      img.addEventListener("error", function(){ a.remove(); });
      a.addEventListener("click", function(e){
        e.preventDefault();
        openLb(a.href, img.alt);
      });
      a.appendChild(img);
      grid.appendChild(a);
    });

    // Lightbox
    var lb = document.getElementById("lb"),
        lbImg = document.getElementById("lbImg"),
        lbCap = document.getElementById("lbCap");
    function currentTiles(){ return Array.prototype.slice.call(grid.querySelectorAll(".g-item")); }
    function openLb(src, cap){
      lbImg.src = src; lbImg.alt = cap; lbCap.textContent = cap;
      lb.classList.add("open"); document.body.style.overflow = "hidden";
    }
    function closeLb(){ lb.classList.remove("open"); document.body.style.overflow = ""; }
    function step(dir){
      var tiles = currentTiles();
      var srcs = tiles.map(function(t){ return t.getAttribute("href"); });
      var i = srcs.indexOf(lbImg.getAttribute("src"));
      if(i === -1) return;
      var n = (i + dir + srcs.length) % srcs.length;
      var alt = tiles[n].querySelector("img").alt;
      openLb(srcs[n], alt);
    }
    document.getElementById("lbClose").addEventListener("click", function(e){e.stopPropagation();closeLb();});
    document.getElementById("lbPrev").addEventListener("click", function(e){e.stopPropagation();step(-1);});
    document.getElementById("lbNext").addEventListener("click", function(e){e.stopPropagation();step(1);});
    lb.addEventListener("click", closeLb);
    lbImg.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("keydown", function(e){
      if(!lb.classList.contains("open")) return;
      if(e.key === "Escape") closeLb();
      else if(e.key === "ArrowLeft") step(-1);
      else if(e.key === "ArrowRight") step(1);
    });
